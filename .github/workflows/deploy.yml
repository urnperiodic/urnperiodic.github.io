name: Build & Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application & server
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html || test -f dist/dev.html
          test -f dist/server.cjs
