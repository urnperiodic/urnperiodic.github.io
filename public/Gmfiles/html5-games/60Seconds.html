<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>60 Seconds - Web</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/Image.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/TemplateData/style.css">
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(message, type) {
        var banner = document.createElement("div");
        banner.textContent = message;
        warningBanner.appendChild(banner);
        if (type === "error") {
          banner.style.cssText = "background:red;padding:10px;color:white";
        } else {
          banner.style.cssText = "background:yellow;padding:10px;color:black";
          setTimeout(function() {
            banner.remove();
          }, 5000);
        }
      }

      var baseUrl = "https://cdn.jsdelivr.net/gh/usheje883-maker/60-Seconds-Webport@main/";
      var buildUrl = baseUrl + "Build";
      var loaderUrl = buildUrl + "/Build.loader.js";
      var dataFiles = [
        "Build.data.unityweb.0",
        "Build.data.unityweb.1",
        "Build.data.unityweb.2",
        "Build.data.unityweb.3",
        "Build.data.unityweb.4",
        "Build.data.unityweb.5"
      ];
      loadingBar.style.display = "block";

      Promise.all(dataFiles.map(function(file) {
        return fetch(buildUrl + "/" + file).then(function(response) {
          if (!response.ok) throw new Error("Failed to load " + file);
          return response.arrayBuffer();
        });
      })).then(function(parts) {
        var total = parts.reduce(function(size, part) {
          return size + part.byteLength;
        }, 0);
        var combined = new Uint8Array(total);
        var offset = 0;
        parts.forEach(function(part) {
          combined.set(new Uint8Array(part), offset);
          offset += part.byteLength;
        });
        var dataBlob = URL.createObjectURL(new Blob([combined]));
        var config = {
          dataUrl: dataBlob,
          frameworkUrl: buildUrl + "/Build.framework.js.unityweb",
          codeUrl: buildUrl + "/Build.wasm.unityweb",
          streamingAssetsUrl: baseUrl + "StreamingAssets",
          companyName: "Robot Gentleman",
          productName: "60 Seconds",
          productVersion: "1.0",
          showBanner: unityShowBanner
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
          config.devicePixelRatio = 1;
          unityShowBanner("WebGL builds are not supported on mobile devices.", "warning");
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = function() {
          createUnityInstance(canvas, config, function(progress) {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(function() {
            loadingBar.style.display = "none";
            URL.revokeObjectURL(dataBlob);
          }).catch(function(error) {
            unityShowBanner(error.message || String(error), "error");
          });
        };
        script.onerror = function() {
          unityShowBanner("Failed to load the Unity WebGL loader.", "error");
        };
        document.body.appendChild(script);
      }).catch(function(error) {
        unityShowBanner(error.message || String(error), "error");
      });
    </script>
  </body>
</html>
